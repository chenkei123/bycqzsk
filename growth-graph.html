<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生长线 - 关系图谱编辑器</title>
    <style>
        /* ========== 全局变量 ========== */
        :root {
            --gg-bg: #0f1117;
            --gg-bg-grad-1: #1a1d2e;
            --gg-bg-grad-2: #0f1117;
            --gg-panel: rgba(30, 33, 48, 0.85);
            --gg-panel-border: rgba(255, 255, 255, 0.08);
            --gg-text: #e4e6f0;
            --gg-text-dim: #8b8fa3;
            --gg-accent: #6366f1;
            --gg-accent-hover: #818cf8;
            --gg-danger: #ef4444;
            --gg-success: #22c55e;
            --gg-radius: 10px;
            --gg-radius-sm: 6px;
            --gg-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --gg-font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--gg-font);
            background: var(--gg-bg);
            color: var(--gg-text);
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========== 顶部控制栏 ========== */
        #gg-top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: var(--gg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gg-panel-border);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            z-index: 100;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
        }

        #gg-top-bar::-webkit-scrollbar {
            height: 0;
        }

        .gg-logo {
            font-size: 15px;
            font-weight: 700;
            color: var(--gg-accent);
            white-space: nowrap;
            margin-right: 8px;
        }

        .gg-divider {
            width: 1px;
            height: 24px;
            background: var(--gg-panel-border);
            flex-shrink: 0;
        }

        /* ========== 顶部栏溢出处理 ========== */
        #gg-top-bar {
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #gg-top-bar::-webkit-scrollbar {
            display: none;
        }

        .gg-more-btn {
            display: none;
            flex-shrink: 0;
        }

        @media (max-width: 1200px) {
            .gg-overflow-btn {
                display: none !important;
            }
            .gg-more-btn {
                display: inline-flex !important;
            }
        }

        #gg-top-bar-overflow {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 16px;
            background: var(--gg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--gg-panel-border);
            align-items: center;
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            z-index: 99;
        }

        #gg-top-bar-overflow.open {
            display: flex;
        }

        .gg-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            background: rgba(255, 255, 255, 0.04);
            color: var(--gg-text);
            font-size: 13px;
            font-family: var(--gg-font);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .gg-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .gg-btn.active {
            background: var(--gg-accent);
            border-color: var(--gg-accent);
            color: #fff;
        }

        .gg-btn.primary {
            background: var(--gg-accent);
            border-color: var(--gg-accent);
            color: #fff;
        }

        .gg-btn.primary:hover {
            background: var(--gg-accent-hover);
        }

        .gg-btn.danger {
            background: transparent;
            border-color: var(--gg-danger);
            color: var(--gg-danger);
        }

        .gg-btn.danger:hover {
            background: var(--gg-danger);
            color: #fff;
        }

        .gg-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .gg-toggle-group {
            display: inline-flex;
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            overflow: hidden;
            flex-shrink: 0;
        }

        .gg-toggle-group .gg-btn {
            border: none;
            border-radius: 0;
            padding: 6px 12px;
        }

        .gg-label {
            font-size: 12px;
            color: var(--gg-text-dim);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .gg-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--gg-accent);
            cursor: pointer;
        }

        .gg-label input[type="range"] {
            width: 80px;
            height: 4px;
            accent-color: var(--gg-accent);
            cursor: pointer;
        }

        .gg-label select {
            background: rgba(255, 255, 255, 0.06);
            color: var(--gg-text);
            border: 1px solid var(--gg-panel-border);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 12px;
            font-family: var(--gg-font);
            cursor: pointer;
        }

        .gg-label select option {
            background: var(--gg-bg);
        }

        .gg-spacer {
            flex: 1;
        }

        /* ========== Canvas 容器 ========== */
        #gg-canvas-wrap {
            position: fixed;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: linear-gradient(135deg, var(--gg-bg-grad-1) 0%, var(--gg-bg-grad-2) 100%);
        }

        #gg-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none;
        }

        #gg-canvas.dragging {
            cursor: grabbing;
        }

        #gg-canvas.linking {
            cursor: crosshair;
        }

        /* ========== 底部编辑面板 ========== */
        #gg-edit-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 320px;
            background: var(--gg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--gg-panel-border);
            padding: 16px 20px;
            z-index: 90;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        #gg-edit-panel.open {
            transform: translateY(0);
        }

        .gg-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gg-panel-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gg-text);
        }

        .gg-panel-close {
            background: none;
            border: none;
            color: var(--gg-text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .gg-panel-close:hover {
            color: var(--gg-text);
        }

        .gg-form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .gg-form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 200px;
        }

        .gg-form-group label {
            font-size: 11px;
            color: var(--gg-text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gg-form-group input[type="text"],
        .gg-form-group textarea {
            background: rgba(255, 255, 255, 0.06);
            color: var(--gg-text);
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            padding: 8px 10px;
            font-size: 13px;
            font-family: var(--gg-font);
            resize: vertical;
            outline: none;
            transition: border-color 0.15s;
        }

        .gg-form-group input[type="text"]:focus,
        .gg-form-group textarea:focus {
            border-color: var(--gg-accent);
        }

        .gg-form-group textarea {
            min-height: 50px;
            max-height: 100px;
        }

        .gg-color-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .gg-color-presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .gg-color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.15s;
            position: relative;
        }

        .gg-color-swatch:hover {
            transform: scale(1.15);
        }

        .gg-color-swatch.selected {
            border-color: #fff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .gg-color-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gg-color-input-wrap input[type="color"] {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .gg-color-input-wrap input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .gg-color-input-wrap input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--gg-panel-border);
            border-radius: 6px;
        }

        .gg-relations-info {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            padding: 10px;
            font-size: 12px;
            color: var(--gg-text-dim);
            max-height: 80px;
            overflow-y: auto;
        }

        .gg-relations-info .gg-rel-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 2px 4px 2px 0;
            padding: 2px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 11px;
            color: var(--gg-text);
        }

        .gg-relations-info .gg-rel-item .gg-rel-arrow {
            color: var(--gg-text-dim);
        }

        .gg-relations-info .gg-rel-empty {
            color: var(--gg-text-dim);
            font-style: italic;
        }

        .gg-panel-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* ========== 缩放指示器 ========== */
        #gg-zoom-indicator {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--gg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            padding: 6px 12px;
            font-size: 12px;
            font-family: var(--gg-font-mono);
            color: var(--gg-text-dim);
            z-index: 80;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #gg-zoom-indicator .gg-zoom-btn {
            background: none;
            border: none;
            color: var(--gg-text);
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            line-height: 1;
        }

        #gg-zoom-indicator .gg-zoom-btn:hover {
            color: var(--gg-accent);
        }

        /* ========== 状态提示 ========== */
        #gg-status-hint {
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--gg-accent);
            border-radius: var(--gg-radius-sm);
            padding: 8px 16px;
            font-size: 13px;
            color: var(--gg-accent);
            z-index: 85;
            display: none;
            animation: gg-fade-in 0.2s ease;
        }

        #gg-status-hint.show {
            display: block;
        }

        @keyframes gg-fade-in {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ========== 导航 ========== */
        .gg-nav-link {
            color: var(--gg-text-dim);
            text-decoration: none;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .gg-nav-link:hover {
            color: var(--gg-text);
            background: rgba(255, 255, 255, 0.06);
        }

        /* ========== 节点存储区域 ========== */
        #gg-node-store {
            position: fixed;
            left: 0;
            top: 52px;
            bottom: 0;
            width: 220px;
            background: var(--gg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--gg-panel-border);
            z-index: 50;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease, transform 0.3s ease;
            overflow: hidden;
        }

        #gg-node-store.collapsed {
            width: 36px;
        }

        #gg-node-store.collapsed .gg-store-header h3,
        #gg-node-store.collapsed .gg-store-body {
            display: none;
        }

        #gg-node-store.collapsed .gg-store-header {
            justify-content: center;
            padding: 8px 0;
        }

        .gg-store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--gg-panel-border);
            flex-shrink: 0;
        }

        .gg-store-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--gg-text);
            white-space: nowrap;
        }

        .gg-store-toggle {
            cursor: pointer;
            font-size: 14px;
            color: var(--gg-text-dim);
            user-select: none;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            line-height: 1;
        }

        .gg-store-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--gg-text);
        }

        .gg-store-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .gg-store-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius-sm);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 12px;
            color: var(--gg-text);
        }

        .gg-store-item:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--gg-accent);
        }

        .gg-store-item.on-canvas {
            opacity: 0.5;
            cursor: default;
        }

        .gg-store-item-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .gg-store-item-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gg-store-item-add {
            font-size: 16px;
            color: var(--gg-accent);
            flex-shrink: 0;
            line-height: 1;
        }

        .gg-store-empty {
            text-align: center;
            color: var(--gg-text-dim);
            font-size: 12px;
            padding: 24px 8px;
        }

        .gg-store-group {
            margin-bottom: 8px;
        }

        .gg-store-group-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--gg-text-dim);
            padding: 6px 4px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--gg-panel-border);
            margin-bottom: 4px;
        }

        /* ========== 连线编辑面板 ========== */
        #gg-edge-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            background: var(--gg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gg-panel-border);
            border-radius: var(--gg-radius) var(--gg-radius) 0 0;
            padding: 16px 20px;
            z-index: 90;
            width: 480px;
            max-width: 90vw;
            transition: transform 0.3s ease;
        }

        #gg-edge-panel.open {
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            #gg-top-bar {
                height: 44px;
                padding: 0 8px;
                gap: 4px;
            }

            .gg-logo {
                font-size: 13px;
                margin-right: 4px;
            }

            .gg-btn {
                padding: 5px 10px;
                font-size: 12px;
            }

            .gg-label {
                font-size: 11px;
            }

            .gg-label input[type="range"] {
                width: 50px;
            }

            #gg-edit-panel {
                padding: 12px;
                max-height: 50vh;
            }

            .gg-form-group {
                min-width: 140px;
            }
        }
    </style>
</head>
<body>
    <!-- ========== 顶部控制栏 ========== -->
    <div id="gg-top-bar">
        <span class="gg-logo">生长线</span>
        <div class="gg-divider"></div>
        <!-- 编辑/演化模式切换 -->
        <div class="gg-toggle-group">
            <button class="gg-btn active" id="gg-mode-edit" data-mode="edit">编辑</button>
            <button class="gg-btn" id="gg-mode-evolve" data-mode="evolve">演化</button>
        </div>
        <div class="gg-divider"></div>
        <!-- 显示控制 -->
        <label class="gg-label"><input type="checkbox" id="gg-show-node-notes" checked> 节点备注</label>
        <label class="gg-label"><input type="checkbox" id="gg-show-edge-notes" checked> 连线备注</label>
        <div class="gg-divider"></div>
        <!-- 画布大小 -->
        <label class="gg-label">画布 <input type="range" id="gg-canvas-scale" min="0.5" max="2" step="0.05" value="1"></label>
        <!-- 视角切换 -->
        <div class="gg-toggle-group">
            <button class="gg-btn active" id="gg-view-local" data-view="local">局部</button>
            <button class="gg-btn" id="gg-view-global" data-view="global">全局</button>
        </div>
        <div class="gg-divider"></div>
        <!-- 帧率 -->
        <label class="gg-label">FPS
            <select id="gg-fps-select">
                <option value="30">30</option>
                <option value="60" selected>60</option>
            </select>
        </label>
        <div class="gg-divider"></div>
        <!-- 操作按钮 -->
        <button class="gg-btn primary" id="gg-add-node">+ 节点</button>
        <button class="gg-btn gg-overflow-btn" id="gg-start-growth">开始生长</button>
        <button class="gg-btn gg-overflow-btn" id="gg-stop-growth" style="display:none;">停止</button>
        <button class="gg-btn gg-overflow-btn" id="gg-import-relations">从关系图谱导入</button>
        <button class="gg-btn gg-overflow-btn" id="gg-import-master">导入总图谱</button>
        <button class="gg-btn gg-overflow-btn" id="gg-save-master">保存为总图谱</button>
        <button class="gg-btn gg-overflow-btn" id="gg-save-node-graph" style="display:none;">保存为节点图谱</button>
        <button class="gg-btn gg-overflow-btn" id="gg-export">导出</button>
        <button class="gg-btn gg-overflow-btn" id="gg-reset-data">重置</button>
        <button class="gg-btn gg-more-btn" id="gg-more-btn">更多 ▼</button>
        <div class="gg-spacer"></div>
        <a href="index.html" class="gg-nav-link">首页</a>
        <a href="relations.html" class="gg-nav-link">关系图谱</a>
    </div>

    <!-- ========== 顶部栏溢出容器（窄屏时显示） ========== -->
    <div id="gg-top-bar-overflow"></div>

    <!-- ========== 节点存储区域 ========== -->
    <div id="gg-node-store">
        <div class="gg-store-header">
            <h3>节点仓库</h3>
            <span class="gg-store-toggle" id="gg-store-toggle" title="折叠/展开">◀</span>
        </div>
        <div class="gg-store-body" id="gg-store-body">
            <div class="gg-store-empty">暂无存储节点<br>点击「导入总图谱」加载</div>
        </div>
    </div>

    <!-- ========== Canvas 容器 ========== -->
    <div id="gg-canvas-wrap">
        <canvas id="gg-canvas"></canvas>
    </div>

    <!-- ========== 底部编辑面板 ========== -->
    <div id="gg-edit-panel">
        <div class="gg-panel-header">
            <span class="gg-panel-title" id="gg-panel-title">节点编辑</span>
            <button class="gg-panel-close" id="gg-panel-close">&times;</button>
        </div>
        <div class="gg-form-row">
            <div class="gg-form-group">
                <label>节点名称</label>
                <input type="text" id="gg-node-title" placeholder="输入节点名称">
            </div>
            <div class="gg-form-group">
                <label>节点备注</label>
                <input type="text" id="gg-node-note" placeholder="输入备注（可选）">
            </div>
        </div>
        <div class="gg-form-row">
            <div class="gg-form-group" style="flex: 0 0 auto; min-width: auto;">
                <label>节点颜色</label>
                <div class="gg-color-section">
                    <div class="gg-color-presets" id="gg-node-color-presets"></div>
                    <div class="gg-color-input-wrap">
                        <input type="color" id="gg-node-color-picker" value="#3b82f6">
                    </div>
                </div>
            </div>
        </div>
        <div class="gg-form-row">
            <div class="gg-form-group">
                <label>母子关系</label>
                <div class="gg-relations-info" id="gg-relations-info">
                    <span class="gg-rel-empty">暂无关系</span>
                </div>
            </div>
        </div>
        <div class="gg-panel-actions">
            <button class="gg-btn" id="gg-start-linking">设为母子线</button>
            <button class="gg-btn danger" id="gg-delete-node">删除节点</button>
        </div>
    </div>

    <!-- ========== 连线编辑面板 ========== -->
    <div id="gg-edge-panel">
        <div class="gg-panel-header">
            <span class="gg-panel-title" id="gg-edge-panel-title">连线关系编辑</span>
            <button class="gg-panel-close" id="gg-edge-panel-close">&times;</button>
        </div>
        <div class="gg-form-row">
            <div class="gg-form-group">
                <label>关系标签</label>
                <input type="text" id="gg-edge-note" placeholder="输入关系标签（如：共同标签: AI）">
            </div>
        </div>
        <div class="gg-form-row">
            <div class="gg-form-group" style="flex: 0 0 auto; min-width: auto;">
                <label>连线颜色</label>
                <div class="gg-color-section">
                    <div class="gg-color-presets" id="gg-edge-color-presets"></div>
                    <div class="gg-color-input-wrap">
                        <input type="color" id="gg-edge-color-picker" value="#6366f1">
                    </div>
                </div>
            </div>
        </div>
        <div class="gg-panel-actions">
            <button class="gg-btn primary" id="gg-save-edge">保存</button>
            <button class="gg-btn danger" id="gg-delete-edge">删除连线</button>
        </div>
    </div>

    <!-- ========== 缩放指示器 ========== -->
    <div id="gg-zoom-indicator">
        <button class="gg-zoom-btn" id="gg-zoom-out">－</button>
        <span id="gg-zoom-text">100%</span>
        <button class="gg-zoom-btn" id="gg-zoom-in">＋</button>
        <button class="gg-zoom-btn" id="gg-zoom-reset" title="重置">⟲</button>
    </div>

    <!-- ========== 状态提示 ========== -->
    <div id="gg-status-hint"></div>

    <script src="models.js"></script>
<script src="db.js"></script>
<script src="growth-graph.js"></script>
</body>
</html>
