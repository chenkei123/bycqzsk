<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>测试页面</h1>
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <script>
        const results = document.getElementById('results');
        let step = 1;
        
        function addResult(text, isSuccess = true) {
            const div = document.createElement('div');
            div.className = isSuccess ? 'success' : 'error';
            div.textContent = step + '. ' + text;
            results.appendChild(div);
            step++;
        }

        addResult('页面加载成功');
        if (typeof FlexSearch !== 'undefined') {
            addResult('FlexSearch 加载成功');
        } else {
            addResult('FlexSearch 加载失败', false);
        }

        // 测试 script 加载
        const scripts = [
            'models.js',
            'db.js',
            'core.js',
            'ui.js'
        ];

        let loadedCount = 0;

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => {
                    addResult(url + ' 加载成功');
                    resolve();
                };
                script.onerror = () => {
                    addResult(url + ' 加载失败', false);
                    reject(new Error('Failed to load ' + url));
                };
                document.body.appendChild(script);
            });
        }

        async function loadAllScripts() {
            try {
                for (const script of scripts) {
                    await loadScript(script);
                }
                
                addResult('所有脚本加载完成');
                
                // 检查全局变量
                if (typeof MODE !== 'undefined') {
                    addResult('MODE 定义成功: ' + JSON.stringify(MODE));
                } else {
                    addResult('MODE 未定义', false);
                }
                
                if (typeof VideoInfo !== 'undefined') {
                    addResult('VideoInfo 类定义成功');
                } else {
                    addResult('VideoInfo 未定义', false);
                }
                
                if (typeof videoDB !== 'undefined') {
                    addResult('videoDB 定义成功');
                } else {
                    addResult('videoDB 未定义', false);
                }
                
                if (typeof coreService !== 'undefined') {
                    addResult('coreService 定义成功');
                } else {
                    addResult('coreService 未定义', false);
                }
                
                if (typeof uiManager !== 'undefined') {
                    addResult('uiManager 变量定义成功');
                } else {
                    addResult('uiManager 变量未定义', false);
                }
                
                // 测试初始化函数
                if (typeof initVideoDB !== 'undefined') {
                    addResult('initVideoDB 函数定义成功');
                    initVideoDB();
                    if (videoDB) {
                        addResult('videoDB 初始化成功');
                    }
                }
                
                if (typeof initCoreService !== 'undefined') {
                    addResult('initCoreService 函数定义成功');
                    initCoreService();
                    if (coreService) {
                        addResult('coreService 初始化成功');
                    }
                }
                
                if (typeof initUIManager !== 'undefined') {
                    addResult('initUIManager 函数定义成功');
                    initUIManager();
                    if (uiManager) {
                        addResult('uiManager 初始化成功');
                    }
                }
                
            } catch (error) {
                addResult('错误: ' + error.message, false);
                console.error(error);
            }
        }

        loadAllScripts();
    </script>
</body>
</html>
