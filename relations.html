                    var match = w.match(numericSuffixRe);
                    if (match) {
                        var base = match[1];
                        // 只有当 base 本身长度 >= 2 时才归一（避免单字+数字）
                        if (base.length >= 2) {
                            suffixMap[w] = base;
                            if (!baseWords[base]) baseWords[base] = 0;
                            baseWords[base] = Math.max(baseWords[base], dfMap[w]);
                            // 同时保留 base 本身如果存在
                            if (dfMap[base]) {
                                baseWords[base] = Math.max(baseWords[base], dfMap[base]);
                            }
                            continue;
                        }
                    }
                    // 非数字后缀词
                    suffixMap[w] = w;
                    mergedDF[w] = dfMap[w];
                }

                // 合并 baseWords 到 mergedDF
                for (var b in baseWords) {
                    if (Object.prototype.hasOwnProperty.call(baseWords, b)) {
                        mergedDF[b] = baseWords[b];
                    }
                }

                return { mergedDF: mergedDF, suffixMap: suffixMap };
            }

            /**
             * 第 5 步：自动生成 autoStopWords 和 autoStopPhrases
             *  - autoStopWords: DF/totalNodes > maxDFRatio 的词（太普遍）
             *  - autoStopPhrases: 同上，但针对短语（多字词）
             * @param {Object} dfMap - word -> count
             * @param {number} totalNodes
             * @returns {{ autoStopWords: Set, autoStopPhrases: Set }}
             */
            _generateAutoStopWords(dfMap, totalNodes) {
                var cfg = RelationsGraph.SCAN_CONFIG;
                var autoStopWords = new Set();
                var autoStopPhrases = new Set();

                if (totalNodes <= 1) return { autoStopWords: autoStopWords, autoStopPhrases: autoStopPhrases };

                for (var w in dfMap) {
                    if (!Object.prototype.hasOwnProperty.call(dfMap, w)) continue;
                    var df = dfMap[w];
                    var ratio = df / totalNodes;
                    if (ratio > cfg.maxDFRatio) {
                        autoStopWords.add(w);
                        // 多字词（>= 3字）同时加入 stopPhrases
                        if (w.length >= 3) {
                            autoStopPhrases.add(w);
                        }
                    }
                }

                return { autoStopWords: autoStopWords, autoStopPhrases: autoStopPhrases };
            }

            /**
             * 第 6 步：对单个节点生成 validTokens
             *  6.1 移除 autoStopPhrases（从原始文本中删除这些短语）
             *  6.2 保护 protectedPhrases（提取出来作为整体 token，不参与滑窗分词）
             *  6.3 长词优先分词（中文部分按 4字->3字->2字 优先匹配）
             *  6.4 过滤 stopWords / autoStopWords
             *  6.5 过滤短词和纯数字
             * @param {Object} node
             * @param {Object} ctx - 扫描上下文 { stopWordsSet, stopPhrasesSet, protectedSet, suffixMap }
             * @returns {Array<string>}
             */
            _generateValidTokens(node, ctx) {
                var cfg = RelationsGraph.SCAN_CONFIG;
                var textObj = this._collectNodeText(node);

                // 合并所有文本
                var rawText = textObj.title + ' ' + textObj.desc + ' ' + textObj.tags.join(' ');

                // 规范化
                var normalized = this._normalizeText(rawText);

                // 6.1 移除 autoStopPhrases 和 manualStopPhrases
                // 从规范化文本中删除这些短语
                var allStopPhrases = Array.from(ctx.stopPhrasesSet);
                // 按长度降序排列，先移除长短语
                allStopPhrases.sort(function(a, b) { return b.length - a.length; });
                for (var spi = 0; spi < allStopPhrases.length; spi++) {
                    var phrase = allStopPhrases[spi];
                    var normPhrase = this._normalizeText(phrase);
                    if (normPhrase) {
                        // 全局替换
                        normalized = normalized.split(normPhrase).join(' ');
                    }
                }

                // 6.2 提取 protectedPhrases
                // 从规范化文本中找出受保护短语，提取后从文本中移除（避免重复分词）
                var protectedTokens = [];
                var protectedList = Array.from(ctx.protectedSet);
                // 按长度降序排列，优先匹配长短语
                protectedList.sort(function(a, b) { return b.length - a.length; });
                for (var pi = 0; pi < protectedList.length; pi++) {
                    var pPhrase = protectedList[pi];
                    var normP = this._normalizeText(pPhrase);
                    if (normP && normalized.indexOf(normP) >= 0) {
                        protectedTokens.push(normP);
                        // 从文本中移除（替换为空格，避免粘连）
                        normalized = normalized.split(normP).join(' ');
                    }
                }

                // 6.3 长词优先分词
                // 对剩余文本按空格切分，对每个中文片段做长词优先匹配
                var remainingTokens = this._splitNormalizedText(normalized);
                var segmentedTokens = [];
                for (var ri = 0; ri < remainingTokens.length; ri++) {
                    var token = remainingTokens[ri];
                    if (!token) continue;
                    // 英文/数字串：整体保留
                    if (/^[a-z0-9]+$/.test(token)) {
                        segmentedTokens.push(token);
                        continue;
                    }
                    // 中文片段：长词优先分词
                    var segs = this._segmentChineseLongFirst(token, ctx);
                    for (var si = 0; si < segs.length; si++) {
                        segmentedTokens.push(segs[si]);
                    }
                }

                // 合并 protectedTokens 和 segmentedTokens
                var allTokens = protectedTokens.concat(segmentedTokens);

                // 6.4 过滤 stopWords / autoStopWords / manualStopWords
                // 6.5 过滤短词和纯数字
                var validTokens = [];
                var seenSet = new Set();
                for (var vi = 0; vi < allTokens.length; vi++) {
                    var word = allTokens[vi];
                    // 数字后缀归一
                    if (ctx.suffixMap && ctx.suffixMap[word]) {
                        word = ctx.suffixMap[word];
                    }
                    // 跳过空
                    if (!word) continue;
                    // 跳过停用词
                    if (ctx.stopWordsSet.has(word)) continue;
                    // 跳过纯数字
                    if (/^\d+$/.test(word)) continue;
                    // 跳过过短词（英文至少 2 字符，中文至少 2 字）
                    if (/^[a-z]+$/.test(word) && word.length < cfg.minWordLength) continue;
                    if (/^[\u4e00-\u9fff]+$/.test(word) && word.length < cfg.minWordLength) continue;
                    // 去重
                    if (seenSet.has(word)) continue;
                    seenSet.add(word);
                    validTokens.push(word);
                }

                return validTokens;
            }

            /**
             * 6.3 辅助：中文长词优先分词
             * 对纯中文片段，优先匹配 4字、3字，最后 2字
             * 避免把"硬核战双"拆成"硬核"、"核战"、"战双"
             * @param {string} chineseText - 纯中文字符串
             * @param {Object} ctx
             * @returns {Array<string>}
             */
            _segmentChineseLongFirst(chineseText, ctx) {
                var cfg = RelationsGraph.SCAN_CONFIG;
                var result = [];
                var text = chineseText;

                // 按长度从大到小尝试匹配：先 6字、5字、4字、3字、2字
                // 每次从文本开头尝试匹配指定长度的子串
                // 如果子串不在停用词集合中，则作为 token 提取
                var maxLen = Math.min(text.length, 6);
                var i = 0;
                while (i < text.length) {
                    var matched = false;
                    // 从最长到最短尝试
                    for (var len = Math.min(maxLen, text.length - i); len >= cfg.minWordLength; len--) {
                        var substr = text.substr(i, len);
                        // 跳过停用词
                        if (ctx.stopWordsSet.has(substr)) continue;
                        // 检查这个子串是否"值得"作为 token
                        // 优先长词：如果当前长度 >= 3，直接采用
                        // 如果长度 === 2，检查是否是某个更长词的碎片（通过 DF 判断）
                        if (len >= 3) {
                            result.push(substr);
                            i += len;
                            matched = true;
                            break;
                        }
                        // len === 2：作为最后手段
                        if (len === cfg.minWordLength) {
                            result.push(substr);
                            i += len;
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) {
                        // 无法分词，跳过一个字符
                        i++;
                    }
                }

                return result;
            }

            /**
             * 第 7 步：用 validTokens 建立倒排索引
             * @param {Array} nodes
             * @param {Object} ctx
             * @returns {{ index: Object, idfMap: Object, nodeTokens: Object }}
             */
            _buildValidTokenIndex(nodes, ctx) {
                var cfg = RelationsGraph.SCAN_CONFIG;
                var totalNodes = nodes.length;
                if (totalNodes === 0) return { index: {}, idfMap: {}, nodeTokens: {} };

                var nodeTokens = {};   // nodeId -> [tokens]
                var index = {};        // token -> Set<nodeId>
                var dfMap = {};        // token -> count

                for (var i = 0; i < nodes.length; i++) {
                    var node = nodes[i];
                    var tokens = this._generateValidTokens(node, ctx);
                    nodeTokens[node.id] = tokens;

                    for (var ti = 0; ti < tokens.length; ti++) {
                        var token = tokens[ti];
                        if (!index[token]) index[token] = new Set();
                        index[token].add(node.id);
                    }
                }

                // 计算 DF 和 IDF
                var filteredIndex = {};
                var idfMap = {};
                for (var w in index) {
                    if (!Object.prototype.hasOwnProperty.call(index, w)) continue;
                    var df = index[w].size;
                    // 过滤普遍词（DF/total > maxDFRatio）和稀有词（DF < minDF）
                    if (totalNodes > 1 && df / totalNodes > cfg.maxDFRatio) continue;
                    if (df < cfg.minDF) continue;
                    // protectedPhrases 不过滤
                    var isProtected = ctx.protectedSet.has(w);
                    if (!isProtected && df / totalNodes > cfg.maxDFRatio) continue;

                    filteredIndex[w] = Array.from(index[w]);
                    idfMap[w] = Math.log(totalNodes / Math.max(df, 1));
                }

                return { index: filteredIndex, idfMap: idfMap, nodeTokens: nodeTokens };
            }

            /**
             * 第 8-12 步：查询相关节点，计算共同词和 score，去除短碎片，取 TopN
             * @param {Array} nodes
             * @param {Object} existingPairs
             * @param {Object} scannedSet
             * @param {Object} opts
             * @returns {Array<{source, target, label, score}>}
             */
            _scanWithInvertedIndex(nodes, existingPairs, scannedSet, opts) {
                opts = opts || {};
                var cfg = RelationsGraph.SCAN_CONFIG;
                var topN = opts.topN || cfg.topN;
                var centerNodeId = opts.centerNodeId || null;
                var knownNodeSet = opts.knownNodeSet || null;
                var centerSavedAt = opts.centerSavedAt || 0;

                // ===== 前置：构建扫描上下文 =====
                // 1. 收集所有节点文本
                var nodeTextMap = {};
                for (var nti = 0; nti < nodes.length; nti++) {
                    var nNode = nodes[nti];
                    var rawText = this._collectNodeText(nNode);
                    nodeTextMap[nNode.id] = {
                        title: this._normalizeText(rawText.title),
                        desc: this._normalizeText(rawText.desc),
                        tags: rawText.tags.map(function(t) { return t; })  // tags 在 _computeDF 中单独规范化
                    };
                }

                // 3. 统计 DF
                var dfResult = this._computeDF(nodes, nodeTextMap);

                // 4. 数字后缀归一
                var suffixResult = this._mergeNumericSuffixes(dfResult.dfMap);

                // 5. 自动生成 autoStopWords / autoStopPhrases
                var autoStopResult = this._generateAutoStopWords(suffixResult.mergedDF, nodes.length);

                // 构建上下文
                var stopWordsSet = new Set(cfg.manualStopWords);
                autoStopResult.autoStopWords.forEach(function(w) { stopWordsSet.add(w); });

                var stopPhrasesSet = new Set(cfg.manualStopPhrases);
                autoStopResult.autoStopPhrases.forEach(function(w) { stopPhrasesSet.add(w); });

                var protectedSet = new Set(cfg.protectedPhrases);
                // 规范化 protectedPhrases
                var normProtectedSet = new Set();
                cfg.protectedPhrases.forEach(function(p) {
                    normProtectedSet.add(this._normalizeText(p));
                }.bind(this));

                var ctx = {
                    stopWordsSet: stopWordsSet,
                    stopPhrasesSet: stopPhrasesSet,
                    protectedSet: normProtectedSet,
                    suffixMap: suffixResult.suffixMap
                };

                // 7. 构建 validToken 倒排索引
                var idxResult = this._buildValidTokenIndex(nodes, ctx);
                var index = idxResult.index;
                var idfMap = idxResult.idfMap;
                var nodeTokens = idxResult.nodeTokens;

                // 构建 nodeId -> node 的快速查找表
                var nodeMap = {};
                for (var ni = 0; ni < nodes.length; ni++) {
                    nodeMap[nodes[ni].id] = nodes[ni];
                }

                // ===== 8-12: 遍历每个节点，查询相关节点 =====
                var newEdges = [];

                for (var i = 0; i < nodes.length; i++) {
                    var node = nodes[i];
                    var tokens = nodeTokens[node.id] || [];
                    if (tokens.length === 0) continue;

                    // 9. 计算共同词和 score
                    var scoreMap = {};   // nodeId -> { score, commonTokens: Set }
                    for (var wi = 0; wi < tokens.length; wi++) {
                        var token = tokens[wi];
                        var postings = index[token];
                        if (!postings) continue;
                        var idf = idfMap[token] || 1;
                        for (var pi = 0; pi < postings.length; pi++) {
                            var otherId = postings[pi];
                            if (otherId === node.id) continue;

                            var otherNode = nodeMap[otherId];
                            if (!otherNode) continue;
                            // 类型过滤：只扫同类型
                            if (node.type && otherNode.type && node.type !== otherNode.type) continue;

                            // 增量扫描过滤
                            if (centerNodeId && centerSavedAt > 0) {
                                var isCenterA = node.id === centerNodeId;
                                var isCenterB = otherId === centerNodeId;
                                if (!isCenterA && !isCenterB) continue;
                                var otherForDate = isCenterA ? otherNode : node;
                                var otherAddDate = otherForDate.addDate || otherForDate._addDate || 0;
                                if (otherAddDate <= centerSavedAt) continue;
                            } else if (knownNodeSet) {
                                var aIsNew = !knownNodeSet.has(node.id);
                                var bIsNew = !knownNodeSet.has(otherId);
                                if (!aIsNew && !bIsNew) continue;
                            }

                            // 跳过已存在的关系
                            var pair = node.id + '|' + otherId;
                            var pairRev = otherId + '|' + node.id;
                            if (existingPairs.has(pair) || existingPairs.has(pairRev)) continue;
                            if (scannedSet && (scannedSet.has(pair) || scannedSet.has(pairRev))) continue;

                            if (!scoreMap[otherId]) {
                                scoreMap[otherId] = { score: 0, commonTokens: [] };
                            }
                            // 长词权重更高
                            var tokenWeight = idf * (token.length >= 3 ? 1.5 : 1.0);
                            scoreMap[otherId].score += tokenWeight;
                            if (scoreMap[otherId].commonTokens.indexOf(token) < 0) {
                                scoreMap[otherId].commonTokens.push(token);
                            }
                        }
                    }

                    // 10. 去除长词已存在时的短碎片
                    // 如果 commonTokens 中有 "硬核战双"（4字），则移除 "硬核"、"核战"、"战双" 等 2字碎片
                    for (var oid in scoreMap) {
                        if (Object.prototype.hasOwnProperty.call(scoreMap, oid)) {
                            scoreMap[oid].commonTokens = this._removeShortFragments(scoreMap[oid].commonTokens);
                        }
                    }

                    // 11. 按分数排序，取 TopN
                    var scored = [];
                    for (var oid2 in scoreMap) {
                        if (Object.prototype.hasOwnProperty.call(scoreMap, oid2)) {
                            // 只保留有共同词的关系
                            if (scoreMap[oid2].commonTokens.length === 0) continue;
                            scored.push({
                                id: oid2,
                                score: scoreMap[oid2].score,
                                commonTokens: scoreMap[oid2].commonTokens
                            });
                        }
                    }
                    scored.sort(function(a, b) { return b.score - a.score; });

                    var limit = Math.min(topN, scored.length);
                    for (var si = 0; si < limit; si++) {
                        var item = scored[si];
                        var pair2 = node.id + '|' + item.id;
                        var pairRev2 = item.id + '|' + node.id;
                        if (existingPairs.has(pair2) || existingPairs.has(pairRev2)) continue;

                        // 12. edge.note 只显示最终 commonTokens
                        var label = item.commonTokens.slice(0, 5).join('、');

                        newEdges.push({
                            source: node.id,
                            target: item.id,
                            label: label,
                            score: item.score
                        });
                        existingPairs.add(pair2);
                        existingPairs.add(pairRev2);
                    }
                }

                return newEdges;
            }

            /**
             * 第 10 步辅助：去除长词已存在时的短碎片
             * 如果 tokens 中有长词（>= 3字），则检查是否有 2字碎片是该长词的子串
             * 如果是子串则移除短碎片，避免"硬核战双"已存在时还显示"硬核"、"核战"、"战双"
             * @param {Array<string>} tokens
             * @returns {Array<string>}
             */
            _removeShortFragments(tokens) {
                if (!tokens || tokens.length <= 1) return tokens || [];
                // 按长度降序排列
                var sorted = tokens.slice().sort(function(a, b) { return b.length - a.length; });
                var longWords = [];  // >= 3字的词
                var shortWords = []; // 2字的词
                for (var i = 0; i < sorted.length; i++) {
                    if (sorted[i].length >= 3) {
                        longWords.push(sorted[i]);
                    } else {
                        shortWords.push(sorted[i]);
                    }
                }
                // 如果没有长词，直接返回原 tokens
                if (longWords.length === 0) return tokens;
                // 过滤短词：如果短词是任一长词的子串，则移除
                var result = longWords.slice();
                for (var j = 0; j < shortWords.length; j++) {
                    var shortW = shortWords[j];
                    var isFragment = false;
                    for (var k = 0; k < longWords.length; k++) {
                        if (longWords[k].indexOf(shortW) >= 0) {
                            isFragment = true;
                            break;
                        }
                    }
                    if (!isFragment) {
                        result.push(shortW);
                    }
                }
                return result;
            }

            performAutoScan() {
                var existingPairs = new Set();
                for (var ei = 0; ei < this.edges.length; ei++) {
                    var e = this.edges[ei];
                    existingPairs.add(e.source + '|' + e.target);
                    existingPairs.add(e.target + '|' + e.source);
                }

                var newEdges = this._scanWithInvertedIndex(this.nodes, existingPairs, null, {});
                var newEdgeCount = 0;
                for (var i = 0; i < newEdges.length; i++) {
                    var ne = newEdges[i];
                    this.edges.push({
                        id: 'edge_auto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                        source: ne.source,
                        target: ne.target,
                        label: ne.label
                    });
                    newEdgeCount++;
                }
                return newEdgeCount;
            }

            async performAutoScanAsync() {
                var cfg = RelationsGraph.SCAN_CONFIG;

                var existingPairs = new Set();
                for (var ei = 0; ei < this.edges.length; ei++) {
                    var e = this.edges[ei];
                    existingPairs.add(e.source + '|' + e.target);
                    existingPairs.add(e.target + '|' + e.source);
                }

                // 加载已扫描记录（增量扫描）
                var scannedKey = 'kb_scannedPairs';
                var scannedStr = null;
                try { scannedStr = localStorage.getItem(scannedKey); } catch (e) {}
                var scannedPairs = scannedStr ? JSON.parse(scannedStr) : {};
                var scannedSet = new Set(Object.keys(scannedPairs));

                // 加载上次保存图谱时已知的节点ID集合，用于增量扫描
                var knownNodesKey = 'kb_graphKnownNodeIds';
                var knownNodesStr = null;
                try { knownNodesStr = localStorage.getItem(knownNodesKey); } catch (e) {}
                var knownNodeIds = knownNodesStr ? JSON.parse(knownNodesStr) : null;
                var knownNodeSet = knownNodeIds ? new Set(knownNodeIds) : null;

                // ===== 生长线增量扫描：加载中心节点已保存的节点图谱 =====
                var centerSavedAt = 0;
                var centerNodeGraphData = null;
                if (this.currentCenterNodeId) {
                    var nodeGraphRaw = null;
                    try { nodeGraphRaw = localStorage.getItem('gg_node_graph_' + this.currentCenterNodeId); } catch (e) {}
                    if (nodeGraphRaw) {
                        try {
                            centerNodeGraphData = JSON.parse(nodeGraphRaw);
                            centerSavedAt = centerNodeGraphData.savedAt || 0;
                            // 加载已保存的关系到当前 edges（避免重复扫描已确认的关系）
                            if (centerNodeGraphData.edges && centerNodeGraphData.edges.length > 0) {
                                for (var gei = 0; gei < centerNodeGraphData.edges.length; gei++) {
                                    var ge = centerNodeGraphData.edges[gei];
                                    var gePair = ge.source + '|' + ge.target;
                                    var gePairRev = ge.target + '|' + ge.source;
                                    if (!existingPairs.has(gePair) && !existingPairs.has(gePairRev)) {
                                        this.edges.push({
                                            id: ge.id || ('edge_gg_' + Date.now() + '_' + gei),
                                            source: ge.source,
                                            target: ge.target,
                                            label: ge.note || ''
                                        });
                                        existingPairs.add(gePair);
                                        existingPairs.add(gePairRev);
                                    }
                                }
                            }
                        } catch (err) {
                            console.warn('[增量扫描] 加载节点图谱失败:', err);
                        }
                    }
                }

                // 使用倒排索引算法扫描
                var newEdges = this._scanWithInvertedIndex(this.nodes, existingPairs, scannedSet, {
                    centerNodeId: this.currentCenterNodeId || null,
                    knownNodeSet: knownNodeSet,
                    centerSavedAt: centerSavedAt,
                    topN: cfg.topN
                });

                if (newEdges.length === 0) {
                    if (centerSavedAt > 0) {
                        console.log('[增量扫描] 中心节点 ' + this.currentCenterNodeId + ' 已扫描所有新节点');
                    }
                    return 0;
                }

                // 分片异步处理，每片处理后 yield 给 UI 线程
                var CHUNK = 50;
                var newCount = 0;
                for (var ci = 0; ci < newEdges.length; ci += CHUNK) {
                    var chunk = newEdges.slice(ci, ci + CHUNK);
                    for (var cj = 0; cj < chunk.length; cj++) {
                        var c = chunk[cj];
                        this.edges.push({
                            id: 'edge_auto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                            source: c.source,
                            target: c.target,
                            label: c.label
                        });
                        existingPairs.add(c.source + '|' + c.target);
                        existingPairs.add(c.target + '|' + c.source);
                        scannedSet.add(c.source + '|' + c.target);
                        newCount++;
                    }
                    var saveObj = {};
                    scannedSet.forEach(function(id) { saveObj[id] = 1; });
                    try {
                        localStorage.setItem(scannedKey, JSON.stringify(saveObj));
                    } catch (e) {
                        console.warn('[performAutoScanAsync] 保存已扫描记录失败（可能超出配额）:', e);
                    }
                    await new Promise(function(r) { setTimeout(r, 0); });
                }
                return newCount;
            }

            /**
             * 保留原有的 detectRelation 方法用于兼容性
             * 新的自动扫描使用倒排索引算法，不再调用此方法
             */
            detectRelation(nodeA, nodeB) {
                var rawTagsA = nodeA && nodeA.tags;
                var rawTagsB = nodeB && nodeB.tags;
                if (!Array.isArray(rawTagsA)) rawTagsA = typeof rawTagsA === 'string' ? rawTagsA.split(',') : [];
                if (!Array.isArray(rawTagsB)) rawTagsB = typeof rawTagsB === 'string' ? rawTagsB.split(',') : [];
                var tagsA = rawTagsA.map(function(t) { return String(t).trim(); }).filter(function(t) { return t; });
                var tagsB = rawTagsB.map(function(t) { return String(t).trim(); }).filter(function(t) { return t; });

                var commonTags = [];
                for (var ti = 0; ti < tagsA.length; ti++) {
                    for (var tj = 0; tj < tagsB.length; tj++) {
                        if (tagsA[ti] === tagsB[tj]) {
                            commonTags.push(tagsA[ti]);
                            break;
                        }
                    }
                }

                if (commonTags.length > 0) {
                    return '共同标签: ' + commonTags.join(', ');
                }

                var descA = (nodeA.desc || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, ' ');
                var descB = (nodeB.desc || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, ' ');
                var segsA = descA.split(/\s+/).filter(function(w) { return w.length >= 2; });
                var segsB = descB.split(/\s+/).filter(function(w) { return w.length >= 2; });

                var common = segsA.filter(function(w) { return segsB.indexOf(w) >= 0; });
                if (common.length >= 2) {
                    return '描述相关: ' + common.slice(0, 3).join('、');
                }
                if (common.length === 1 && common[0].length >= 3) {
                    return '描述相关: ' + common[0];
                }

                return null;
            }

            addRelation() {
                const sourceId = this.sourceNodeSelect.value;
                const targetId = this.targetNodeSelect.value;
                const label = this.relationLabelInput.value;
                
                if (!sourceId || !targetId || !label) return;
                
                this.edges.push({
                    id: 'edge_' + Date.now(),
                    source: sourceId,
                    target: targetId,
                    label: label
                });
                
                // 将涉及的两个节点设为可见
                this.visibleNodeIds.add(sourceId);
                this.visibleNodeIds.add(targetId);
                
                this.relationModal.style.display = 'none';
                this.relationForm.reset();
                this.renderGraph();

                // 自动保存到 IndexedDB，确保手动添加的关系立即持久化
                this._saveEdgesToIndexedDB();
            }

            renderGraph() {
                // 清空容器
                const existingNodes = this.graphContent.querySelectorAll('.node');
                existingNodes.forEach(node => node.remove());
                
                const existingEdges = this.graphContent.querySelectorAll('.edge, .edge-label');
                existingEdges.forEach(edge => edge.remove());
                
                // 获取空状态提示元素
                const emptyHint = document.getElementById('graph-empty-hint');
                
                // 如果没有可见节点，显示提示
                if (this.visibleNodeIds.size === 0) {
                    if (emptyHint) emptyHint.classList.remove('hidden');
                    return;
                }
                if (emptyHint) emptyHint.classList.add('hidden');
                
                // 仅渲染可见节点（同时满足模式过滤）
                var filtered = this.getFilteredNodes().filter(n => this.visibleNodeIds.has(n.id));
                filtered.forEach(node => {
                    this.addNodeToGraph(node);
                });
                
                // 渲染可见节点之间的边
                this.renderEdges();
            }

            renderEdges() {
                // 清空现有边
                const existingEdges = this.graphContent.querySelectorAll('.edge, .edge-label');
                existingEdges.forEach(edge => edge.remove());
                
                // 根据模式过滤边
                var filteredEdges = this.getFilteredEdges();

                // 渲染新边（仅渲染两端节点均可见的边）
                filteredEdges.forEach(edge => {
                    if (!this.visibleNodeIds.has(edge.source) || !this.visibleNodeIds.has(edge.target)) return;
                    
                    const sourceNode = this.nodes.find(n => n.id === edge.source);
                    const targetNode = this.nodes.find(n => n.id === edge.target);
                    
                    if (!sourceNode || !targetNode) return;
                    
                    const sourceEl = this.graphContent.querySelector(`.node[data-node-id="${edge.source}"]`);
                    const targetEl = this.graphContent.querySelector(`.node[data-node-id="${edge.target}"]`);
                    
                    if (!sourceEl || !targetEl) return;
                    
                    // 使用逻辑坐标计算边位置（zoom 由 graphContent 的 zoom 属性统一处理）
                    var sourceX = sourceNode.x + sourceEl.offsetWidth / 2;
                    var sourceY = sourceNode.y + sourceEl.offsetHeight / 2;
                    var targetX = targetNode.x + targetEl.offsetWidth / 2;
                    var targetY = targetNode.y + targetEl.offsetHeight / 2;
                    
                    // 创建边
                    const edgeEl = document.createElement('div');
                    edgeEl.className = 'edge';
                    
                    const length = Math.sqrt(Math.pow(targetX - sourceX, 2) + Math.pow(targetY - sourceY, 2));
                    const angle = Math.atan2(targetY - sourceY, targetX - sourceX) * 180 / Math.PI;
                    
                    edgeEl.style.width = `${length}px`;
                    edgeEl.style.left = `${sourceX}px`;
                    edgeEl.style.top = `${sourceY}px`;
                    edgeEl.style.transform = `rotate(${angle}deg)`;
                    
                    this.graphContent.appendChild(edgeEl);
                    
                    // 创建边标签
                    const labelEl = document.createElement('div');
                    labelEl.className = 'edge-label';
                    labelEl.textContent = edge.label;
                    
                    var labelX = sourceX + (targetX - sourceX) / 2;
                    var labelY = sourceY + (targetY - sourceY) / 2;
                    
                    labelEl.style.left = `${labelX}px`;
                    labelEl.style.top = `${labelY}px`;
                    labelEl.style.transform = 'translate(-50%, -50%)';
                    
                    this.graphContent.appendChild(labelEl);
                });
            }

            saveGraph() {
                const graphData = {
                    nodes: this.nodes.map(n => ({
                        id: n.id,
                        title: n.title,
                        type: n.type,
                        url: n.url || '',
                        desc: n.desc || '',
                        tags: n.tags || [],
                        x: n.x,
                        y: n.y,
                        isCustom: n.isCustom || false
                    })),
                    edges: this.edges
                };
                try {
                    localStorage.setItem('relationsGraph', JSON.stringify(graphData));
                } catch (e) {
                    console.warn('[saveGraph] 保存图谱到 localStorage 失败（可能超出配额）:', e);
                }

                // 保存当前已知节点ID集合，用于下次增量扫描
                var knownNodeIds = this.nodes.map(function(n) { return n.id; });
                try {
                    localStorage.setItem('kb_graphKnownNodeIds', JSON.stringify(knownNodeIds));
                } catch (e) {
                    console.warn('[saveGraph] 保存已知节点ID失败（可能超出配额）:', e);
                }

                // 同时更新已扫描记录：将所有现有节点配对标记为已扫描
                // 这样下次扫描时，已扫描过的配对不会被重复处理
                var scannedStr = null;
                try { scannedStr = localStorage.getItem('kb_scannedPairs'); } catch (e) {}
                var scannedPairs = scannedStr ? JSON.parse(scannedStr) : {};
                var scannedSet = new Set(Object.keys(scannedPairs));
                // 将当前所有节点对加入已扫描集合（仅同类型节点对）
                for (var i = 0; i < this.nodes.length; i++) {
                    for (var j = i + 1; j < this.nodes.length; j++) {
                        var nA = this.nodes[i];
                        var nB = this.nodes[j];
                        if (!nA || !nB) continue;
                        if (nA.type && nB.type && nA.type !== nB.type) continue;
                        scannedSet.add(nA.id + '|' + nB.id);
                    }
                }
                var saveObj = {};
                scannedSet.forEach(function(id) { saveObj[id] = 1; });
                try {
                    localStorage.setItem('kb_scannedPairs', JSON.stringify(saveObj));
                } catch (e) {
                    console.warn('[saveGraph] 保存已扫描配对失败（可能超出配额）:', e);
                }

                // ===== 关键：将手动添加的关系持久化到 IndexedDB =====
                // 这样即使代码更新导致 localStorage 被清理，关系数据也不会丢失
                this._saveEdgesToIndexedDB();
            }

            /**
             * 将边数据保存到 IndexedDB（作为代码更新后的持久化备份）
             */
            async _saveEdgesToIndexedDB() {
                try {
                    if (typeof videoDB !== 'undefined' && videoDB && videoDB.saveRelationsEdges) {
                        await videoDB.saveRelationsEdges(this.edges);
                    }
                } catch (e) {
                    console.warn('保存关系到 IndexedDB 失败:', e);
                }
            }

            /**
             * 从 IndexedDB 加载持久化的关系数据
             */
            async _loadEdgesFromIndexedDB() {
                try {
                    if (typeof videoDB !== 'undefined' && videoDB && videoDB.loadRelationsEdges) {
                        return await videoDB.loadRelationsEdges();
                    }
                } catch (e) {
                    console.warn('从 IndexedDB 加载关系失败:', e);
                }
                return [];
            }

            loadSavedGraph() {
                var savedGraph = null;
                try { savedGraph = localStorage.getItem('relationsGraph'); } catch (e) {}
                if (savedGraph) {
                    try {
                        const graphData = JSON.parse(savedGraph);
                        // 合并保存的节点位置和当前数据库节点
                        const savedNodes = graphData.nodes || [];
                        const savedNodeMap = {};
                        savedNodes.forEach(n => { savedNodeMap[n.id] = n; });

                        this.nodes.forEach(node => {
                            const saved = savedNodeMap[node.id];
                            if (saved) {
                                node.x = saved.x;
                                node.y = saved.y;
                            }
                        });

                        // 恢复自定义节点（数据库中没有的）
                        savedNodes.forEach(saved => {
                            if (saved.isCustom && !this.nodes.find(n => n.id === saved.id)) {
                                this.nodes.push({ ...saved });
                            }
                        });

                        this.edges = graphData.edges || [];
                        this.updateNodeList();
                        this.updateNodeSelects();
                        this.renderGraph();
                    } catch (error) {
                        console.error('加载图谱失败:', error);
                    }
                }
            }

            /**
             * 从 IndexedDB 恢复持久化的关系（在 loadSavedGraph 之后调用，作为双保险）
             */
            async restoreEdgesFromIndexedDB() {
                var dbEdges = await this._loadEdgesFromIndexedDB();
                if (!dbEdges || dbEdges.length === 0) return;

                // 获取当前所有有效的节点 ID
                var validNodeIds = new Set(this.nodes.map(function(n) { return n.id; }));

                // 过滤出两端节点都存在的边，避免孤立的无效关系
                var validEdges = dbEdges.filter(function(e) {
                    return validNodeIds.has(e.source) && validNodeIds.has(e.target);
                });

                if (validEdges.length === 0) return;

                // 合并策略：以现有 edges 为基础，补充 IndexedDB 中有但本地没有的边
                var existingPairs = new Set();
                for (var i = 0; i < this.edges.length; i++) {
                    var e = this.edges[i];
                    existingPairs.add(e.source + '|' + e.target);
                    existingPairs.add(e.target + '|' + e.source);
                }

                var addedCount = 0;
                for (var j = 0; j < validEdges.length; j++) {
                    var ve = validEdges[j];
                    var pair = ve.source + '|' + ve.target;
                    var pairRev = ve.target + '|' + ve.source;
                    if (!existingPairs.has(pair) && !existingPairs.has(pairRev)) {
                        this.edges.push({
                            id: ve.id || ('edge_db_' + Date.now() + '_' + j),
                            source: ve.source,
                            target: ve.target,
                            label: ve.label || ve.note || ''
                        });
                        existingPairs.add(pair);
                        addedCount++;
                    }
                }

                if (addedCount > 0) {
                    console.log('[restoreEdgesFromIndexedDB] 从 IndexedDB 恢复了 ' + addedCount + ' 条关系');
                    this.updateNodeList();
                    this.updateNodeSelects();
                    this.renderGraph();
                }
            }
        }

        // 初始化关系图谱
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const graph = new RelationsGraph();
            } catch (error) {
                console.error('初始化关系图谱失败:', error);
            }
        });
    </script>
